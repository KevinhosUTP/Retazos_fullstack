services:
  retazos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retazos-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RETAZOS_PORT:-8095}:8080"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8080"
      RETAZO_ESCRITORIO: "false"
      RETAZO_ARCHIVO_DATOS: "/app/data/retazo"
      RETAZO_DEMO_PASSWORD: "${RETAZO_DEMO_PASSWORD:?Define la password inicial}"
    volumes:
      - retazos-data:/app/data

volumes:
  retazos-data:
